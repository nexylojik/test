рация, тем быстрее достигается ПР и быстрее выпадает осадок)</li><li>рН среды</li><li>Температура ( с увеличением температуры растворимость осадков увеличивается)</li><li>Присутствие посторонних веществ</li><li>Условия осаждения (быстрое или медленное, из разбавленных или концентрированных растворов, при перемешивании или без)</li><li>Характер образующегося осадка (аморфный, кристаллический, рыхлый, плотный, крупно или мелкозернистый)</li><li>Возможность протекания побочных реакций</li></ul>"}, {"n": 230, "q": "Процесс расслоения, биологическое значение.", "a": "<p>Расслоение характерно для пересыщенных водных растворов ограниченно растворимых органических веществ: большинство спиртов, кетонов, карбоновых кислот, эфиров и ВМС</p><p>Для пересыщенных водных растворов этих веществ характерно 2 гетерогенных равновесия, сопровождающиеся: выделением твердого вещества или расслоением системы на 2 несмешивающиеся жидкости</p><p>Процессу расслоения способствует добавление к раствору посторонних соединений, обычно солей</p><p>Процессы расслоения</p><ul class=\"src-list\"><li>Приводят к резкому изменению биологических функций клетки</li><li>На этом процессе основано применение анестетиков</li><li>Анестетики - вещества, в присутствии которых происходит обратимое расслоение водной среды в биосистемах, которое исчезает при их удалении</li></ul><p>Анестезирующий эффект</p><ul class=\"src-list\"><li>диэтиловый эфир (C₂H₅)₂O</li><li>хлороформ СНСІ3</li><li>закись азота N₂₀</li><li>фторотан CF₃CBrClH</li><li>ксенон</li></ul>"}, {"n": 231, "q": "Обратимые процессы выделения в медико-биологической практике.", "a": "<p>Обратимые процессы выделения, при которых осаждаемые вещества не подвергаются глубоким изменениям</p><ul class=\"src-list\"><li><em>Высаливание </em>- выпадение вещества с помощью насыщенных растворов растворимых солей (Na,SO₄,(NH₄),SO₄, MgSO₄, NaCl)</li><li><em>Способ замены растворителя</em>- добавление к водному раствору белка больших количеств в спирта или ацетона.</li></ul>"}, {"n": 232, "q": "Практически необратимые процессы выделения в медико-биологической практике.", "a": "<p>Практически необратимые процессы выделения, когда наблюдаются глубокие изменения структуры</p><ul class=\"src-list\"><li>Добавление солей тяжелых металлов (Cu, Ag, Hg, Zn, Pb)</li><li>Действие концентрированных минеральных кислот (HNO₃, HCI, H₂SO₄) и сильных органических кислот (трихлоруксусная, сульфосалициловая)</li><li>Водные растворы фенола и формальдегида (формалин)</li><li>Нагревание свыше 50°С</li></ul>"}, {"n": 233, "q": "Гетерогенное равновесие в костной ткани.", "a": "<p>Формирование костной ткани</p><ul class=\"src-list\"><li>В клетках костной ткани - остеобластах происходит процесс минерализации - конечный этап образования костной ткани. В остеобластах идет образование гидроксилапатита ( Ca₅(PO₄)₃OH )</li><li>В остеокластах - деминерализация в результате локального повышения кислотности среды</li></ul><figure class=\"src-fig\"><img src=\"img/k3_123.webp\" alt=\"Иллюстрация к ответу\" loading=\"lazy\"></figure><figure class=\"src-fig\"><img src=\"img/k3_123.webp\" alt=\"Иллюстрация к ответу\" loading=\"lazy\"></figure>"}, {"n": 234, "q": "Значение костной ткани как кальциевого буфера.", "a": "<p>Кости служат депо кальция.При снижении уровня Са2+ в крови он вымывается из костей, при избытке - откладывается в них, поддерживая постоянство концентрации</p><p>(гомеостаз).</p><p>Костная ткань - кальциевый буфер</p><ul class=\"src-list\"><li>При повышении концентрации свободных Са2+ в плазме крови - отложение кальция в костной ткани</li><li>При уменьшении концентрации свободных Са2+ в плазме крови - растворение минеральных компонентов костной ткани</li></ul>"}, {"n": 235, "q": "Регуляторы кальций - фосфорного обмена.", "a": "<p>Благодаря взаимодействию регуляторов поддерживается постоянная концентрация этих ионов в сыворотке крови, межклеточной жидкости и тканях</p><ul class=\"src-list\"><li>Витамин D - процессы всасывания ионов кальция и фосфатов из кишечника</li><li>Гормоны паратирин и кальцитонин -процессы депонирования кальция и фосфатов в костной ткани и выведения через почки</li></ul>"}, {"n": 236, "q": "Процесс камнеобразования в почках.", "a": "<p><em>Камнеобразование </em>- сложный физико-химический процесс, в основе которого лежит не только образование малорастворимых соединений, но и нарушение коллоидного равновесия в тканях организма</p><p>Формирование камней происходит из коллоидных частиц в результате процесса коагуляции</p>"}, {"n": 237, "q": "Разновидности камней в почках. Влияние рН на их образование.", "a": "<ul class=\"src-list\"><li>В кислой среде мочи (pH&lt;5) образуются ураты кальция (соли мочевой кислоты)</li><li>В щелочной среде (pH&gt;7) могут образовываться малорастворимые фосфаты кальция</li><li>Малорастворимые оксалаты кальция могут встречаться как в кислой, так и в щелочной моче</li></ul>"}, {"n": 238, "q": "Кальциноз, условия процесса.", "a": "<p><em>Кальциноз </em>-патологическое отложение солей кальция в мягких тканях или органах, где их в норме быть не должно. Отложение СаСО3, может происходить на стенках кровеносных сосудов.</p><p>Первостепенная причина:</p><ul class=\"src-list\"><li>Пересыщенность крови кальцием (при повреждении мягких тканей)</li><li>Нарушение функций паращитовидных желез</li><li>Нарушение пропорций</li><li>Избыток витамина D</li><li>Заболевание почек</li></ul>"}]}, {"id": "k3s7", "title": "Комплексные соединения", "items": [{"n": 239, "q": "Какие соединения называются комплексными (координационными)?", "a": "<p>Приведите примеры.</p><p><em>Комплексные соединения </em>- устойчивые химические соединения, в которых имеется хотя бы одна связь, образованная по донорно-акцепторному механизму; соединения содержат в своём составе комплексные ионы, способные к существованию как в растворе, так и в кристалле</p>"}, {"n": 240, "q": "Основные положения координационной теории Вернера.", "a": "<ul class=\"src-list\"><li>Центральное место в комплексных соединениях занимает комплексообразователь: Fe₃<sup>+</sup></li><li>С комплексообразователем координированы лиганды: CN<sup>−</sup></li><li>Комплексообразователь + лиганды - внутренняя сфера комплексного соединения: [Fe(CN)₆]₃<sup>−</sup></li><li>Обычно присутствует внешняя сфера: K<sup>+</sup></li></ul>"}, {"n": 241, "q": "Охарактеризуйте комплексообразующую способность s<sup>−</sup>, p<sup>−</sup>, d<sup>−</sup>, f-элементов.", "a": "<ul class=\"src-list\"><li>Положительно заряженный ион (металл; редко могут быть неметаллы: Si₄<sup>+</sup>, P₅<sup>+</sup>,</li></ul><p>S₆<sup>+</sup>, I₇<sup>+</sup>)</p><ul class=\"src-list\"><li>Нейтральный атом металла ( [Ni(CO)₄] )</li><li>Также могут иметь отрицательную с.о. (Редко) неметаллы: I<sup>−</sup>,S₂<sup>−</sup>, N₃<sup>−</sup>)</li></ul><p>Наибольшей комплексообразовательной способностью обладают f и d - элементы f&gt;d&gt;p&gt;&gt;s</p>"}, {"n": 242, "q": "Строение внутренней сферы комплексного соединения.", "a": "<p>Комплексообразователь и лиганды формируют внутреннюю сферу комплекса, которая при написании заключается в квадратные скобки и остается стабильной при растворении</p><p>В зависимости от заряда внутренней сферы комплексные соединения делятся на:</p><p><em>анионные </em>- внутренняя сфера заряжена отрицательно K₃[Fe(CN)₆] <em>катионные </em>- внутренняя сфера заряжена положительно [Ag(NH₃)₃]OH <em>нейтральные комплексы </em>[Ni(CO₀₄]</p>"}, {"n": 243, "q": "Какие частицы могут быть комплексообразователями, лигандами в комплексных соединениях? Приведите примеры. Как осуществляется связь между комплексообразователем и лигандами?", "a": "<p><em>Комплексообразователь </em>:</p><ul class=\"src-list\"><li>Положительно заряженный ион (металл; редко могут быть неметаллы: Si₄<sup>+</sup>, P₅<sup>+</sup>,</li></ul><p>S₆<sup>+</sup>, I₇<sup>+</sup>)</p><ul class=\"src-list\"><li>Нейтральный атом металла ( [Ni(CO)₄] )</li><li>Также могут иметь отрицательную с.о. (Редко) неметаллы: I<sup>−</sup>,S₂<sup>−</sup>, N₃<sup>−</sup>)</li></ul><p><em>Лиганды</em>:</p><ul class=\"src-list\"><li>Ионы противоположного знака по отношению к комплексообразователю (CN<sup>−</sup>;</li></ul><p>NO₂<sup>−</sup>, NO₃<sup>−</sup>, Сl<sup>−</sup>, Вr<sup>−</sup>, I<sup>−</sup>, ОН<sup>−</sup>, СОз2-)</p><ul class=\"src-list\"><li>Нейтральные полярные молекулы (NH₃, H₂O, NO, CO)</li><li>Неполярные молекулы, которые могут поляризоваться в электрическом поле иона-комплексообразователя (этилен и др)</li></ul><p>Связь между комплексообразователем и лигандами является донорно-акцепторной.</p><p>Лиганды предоставляют электронные пары, а центральный атом комплекса — свободные орбитали.</p><p>Мерой прочности связи служит степень перекрывания орбиталей.</p>"}, {"n": 244, "q": "Что называется координационным числом комплексообразователя? Как связано координационное число с зарядом иона-комплексообразователя?", "a": "<p><em>Координационное число </em>- число лигандов (монодентантные) связанных с комплексообразователем или число связей, которые образуют комплексообразователь с лигандами.</p>"}, {"n": 245, "q": "Охарактеризуйте понятие дентантности лигандов. Приведите примеры моно", "a": "<ul class=\"src-list\"><li>, бидентатных и полидентатных лигандов.</li></ul><p><em>Дентантность </em>- количество связей,которые образуют лиганды с комплексообразователем</p><ul class=\"src-list\"><li><em>Монодентантные </em>(H₂O, NH₃, CO, CN<sup>−</sup>, I<sup>−</sup>, Br<sup>−</sup>)</li><li><em>Бидентантные </em>(C₂O₄₂<sup>−</sup>, SO₄₂<sup>−</sup>, CO₃₂<sup>−</sup>)</li><li><em>Полидентантные </em>образуют более двух связей с комплексообразователем (трилон</li></ul><p>Б)</p>"}, {"n": 246, "q": "Определите степень окисления и координационное число комплексообразователя в соединениях: Cu₂[Fe(CN)₆], [Cu(NH₃)₄]SO₄, [Cr(NH₃)₃Cl₃]", "a": "<p>Cu₂[Fe(CN)₆]: комплексообразователь - железо (Fe), степень окисления - +2, координационное число - 6</p><p>[Cu(NH₃)₄]SO₄: комплексообразователь - медь (Cu), степень окисления - +2, координационное число - 4</p><p>[Cr(NH₃)₃CI₃]: комплексообразователь - хром (Сг), степень окисления - +3, координационное число - 6</p>"}, {"n": 247, "q": "Внешняя сфера комплексного соединения. Каков характер связи между внутренней и внешней сферами соединения?", "a": "<p>Присутствует если внутренняя сфера имеет заряд</p><p>Состоит из:</p><ul class=\"src-list\"><li>Положительно заряженных ионов, если комплексный ион заряжен отрицательно</li></ul><p>K₃₁+[Fe₃+(CN)₆]₃<sup>−</sup></p><ul class=\"src-list\"><li>Отрицательно заряженных ионов, если комплексный ион заряжен положительно[Cu₂(NH₃)₄]₂+SO₄₂<sup>−</sup></li><li>Может отсутствовать, если заряд комплекса равен 0 [Pt₂+(NH₃)₄Cl₂] или</li></ul><p>[Fe(CO)₅]</p><p>Между внешней и внутренней сферой развивается ионная связь</p>"}, {"n": 248, "q": "Определите заряд комплексных ионов: [HgI₄], [AlF₆], [Са(Н20)4], [Co(NH₃)₂(NO₂)₄], [Cd(NH₃)₄], [Ag(CN)₂].", "a": "<p>[Hgl4] - заряд комплексного иона равен -2 (заряд иона ртути равен +2, а общий заряд четырёх ионов йода — 4).</p><p>[AIF₆] — заряд комплексного иона равен -3.</p><p>[Cа(H₂O)₄] - заряд комплексного иона равен +2</p><p>[Co(NH₃)₂(NO₂)₄] — заряд комплексного иона равен -1</p><p>[Cd(NH₃)₄] - заряд комплексного иона равен +2</p><p>[Ag(CN)₂] — заряд комплексного иона равен -1</p>"}, {"n": 249, "q": "Связь пространственного строения комплексного иона с координационным числом комплексообразователя.", "a": "<p>Координационное число=2 -строение линейное</p><p>Координационное число=4 -строение квадрат, тетраэдр</p><p>Координационное число=6 -строение октаэдр</p>"}, {"n": 250, "q": "Первичная и вторичная диссоциация комплексных соединений.", "a": "<p><em>Первичная </em>- диссоциация комплексных соединений на внутреннюю и внешнюю сферы</p><p>(происходит практически нацело)</p><p>[Ag(NH₃)₂]Cl⇌ [Ag(NH₃)₂]<sup>+</sup> +Cl<sup>−</sup></p><p><em>Вторичная </em>- диссоциация внутренней сферы на лиганды и комплексообразователь;</p><p>происходит частично протекает обратимо и ступенчато</p><p>[Ag(NH₃)₂]<sup>+</sup> ⇌[Ag(NH₃)]<sup>+</sup> +NH₃</p><p>[Ag(NH₃)]<sup>+</sup> ⇌Ag<sup>+</sup> +NH₃</p><p>Суммарное уравнение</p><p>[Ag(NH₃)₂]<sup>+</sup> ⇌Ag<sup>+</sup> +2NH₃</p>"}, {"n": 251, "q": "Константа устойчивости комплексного соединения как среда их прочности.", "a": "<p><em>Константа устойчивости</em>- величина обратная константе нестойкости</p><p>Ку=1/Кн</p>"}, {"n": 252, "q": "Классификация комплексных соединений по заряду внутренней сферы.", "a": "<p>Приведите примеры.</p><p><em>анионные </em>- внутренняя сфера заряжена отрицательно K₃[Fe(CN)₆] <em>катионные </em>- внутренняя сфера заряжена положительно [Ag(NH₃)₃]OH <em>нейтральные комплексы </em>[Ni(CO₀₄]</p>"}, {"n": 253, "q": "Классификация комплексных соединений по природе лигандов и по строению. Приведите примеры.", "a": "<p><em>Ацидокомплексы</em>- лиганды являются отрицательно заряженные анионы кислот H₂[SiF₆]</p><p><em>Гидрокомплексы</em>- лигандами являются гидроксо группы Na₂[Zn(OH)₄]</p><p><em>Аммиакаты, аквакомплексы, карбонилы </em>- полярные молекулы различных веществ</p><p>(NH₃, H₂O, CO) [Ag(NH₃)₂]OH, [Co(H₂O)₆]Cl₂, [Ni(CO)₄]</p><p>Одноядерные - в молекуле один комплексообразователь</p><p><em>Многоядерные </em>- в молекуле два и более комплексообразователей</p><p>[(NH₃)₅Co-NH₂-Co(NH₃)₅]₅<sup>+</sup></p>"}, {"n": 254, "q": "Какие комплексные соединения называют хелатными? Приведите примеры.", "a": "<p>В чем особенность хелатообразующих лигандов.</p><p><em>Циклические </em>(хелатные): устойчивые комплексные соединения металлов с полидентантными лигандами, в которых центральный атом является компонентом циклической структуры</p><figure class=\"src-fig\"><img src=\"img/k3_141.webp\" alt=\"Иллюстрация к ответу\" loading=\"lazy\"></figure><p><em>Внутрикомплексные соединения</em>- одна из разновидностей циклических комплексных соединений отличающаяся тем , что один из концевых атомов полидентантного лиганда связан с центральным атомом комплексообразователя ковалентной или ионной связью и донорно-акцепторной</p>"}, {"n": 255, "q": "Основные положения номенклатуры комплексных соединений.", "a": "<ul class=\"src-list\"><li>Вначале называется катион, затем анион ( в начале называют ту сферу, которая положительная); название катиона пишут отдельно от аниона</li><li>При названии внутренней сферы вначале называют лиганды, а затем комплексообразователь ( из различных лигандов вначале называют отрицательные, затем нейтральные)</li><li>При названии отрицательно зауженных ионов добавляется окончание о</li><li>Если в молекуле присутствует несколько одинаковых лигандов, то их количество указывается приставкой</li><li>После названия лигандов называют комплексообразователь, если он входит с состав положительно заряженной внутренней сферы, то его называют русским название элемента в родительном падеже</li><li>Если комплексообразователь в составе отрицательно заряженной внутренней сферы, его называют от латинского названия элемента с окончанием ат</li><li>Если комплексообразователь входит в состав нейтрального комплекса, то его называют от русского названия элемента в именительном падеже</li><li>Не зависимо от места расположения комплексообразователя после его названия указывается его валентность римской цифрой в скобках</li></ul>"}, {"n": 256, "q": "Назовите комплексные соединения: K[Al(OH)₄(Н₂О)₂], K₃[Fe(CN)₆], [Co(NH₃)₅CI]SO₄, [Co(NH₃)₃CI₃].", "a": "<p>K[Al(OH)₄(Н₂О)₂] – калия тетрагидроксодиакваалюминат (III)</p><p>K₃[Fe(CN)₆] – калия гексацианоферрат (III)</p><p>[Co(NH₃)₅CI]SO₄ – хлоропентаамминкобальта (III) сульфат</p><p>[Co(NH₃)₃CI₃] – трихлоротриамминкобальт</p>"}, {"n": 257, "q": "Понятие о комплексонах, их использование в лечебной и аналитической практике.", "a": "<p><em>Комплексоны</em>- полидентантные лиганды, способные образовывать устойчивые хелатные комплексные соединения (трилон Б)</p><p>Применение:</p><ul class=\"src-list\"><li>Трилон Б - в аналитической химии для титриметрического (количественного)</li></ul><p>определения многих катионов и анионов (Ca₂<sup>+</sup>, Mg₂<sup>+</sup>, Co₂<sup>+</sup>, Ni₂<sup>+</sup>, Zn₂<sup>+</sup>, Fe₂,</p><p>Mn₂<sup>+</sup>,Cu₂<sup>+</sup>, SO₄<sup>−</sup>, PO₄<sup>−</sup>)</p><ul class=\"src-list\"><li>Определение жесткости воды методом комплексонометрии</li><li>В лакокрасочной и кинофотопромышленности</li><li>Для разделения редкоземельных элементов</li><li>Для лечения болезней растений</li><li>В медицине для лечения лучевой болезни</li><li>При отравлениях ртутью и свинцом</li><li>При заболеваниях, связанных с отложением в организме малорастворимых солей</li></ul><p>(камни в печени и почках)</p>"}, {"n": 258, "q": "Схематическое строение гемоглобина, оксигемаглобина, хлорофилла.", "a": "<figure class=\"src-fig\"><img src=\"img/k3_146.webp\" alt=\"Иллюстрация к ответу\" loading=\"lazy\"></figure><figure class=\"src-fig\"><img src=\"img/k3_147.webp\" alt=\"Иллюстрация к ответу\" loading=\"lazy\"></figure>"}]}];
const DATA_B = [{"id": "k1s1", "title": "Протолитическая теория и pH", "items": [{"n": 74, "q": "Определение кислоты и основания согласно протолитической теории, примеры.", "a": "<p>Кислота - донор протонов Н<sup>+</sup> (H₂SO₄,HCl)</p><p>Основание - принимает протоны Н<sup>+</sup> (акцептор)(NaOH,KOH)</p>"}, {"n": 75, "q": "Классификация кислот согласно протолитической теории, примеры.", "a": "<ul class=\"src-list\"><li>катионные (NH₄<sup>+</sup> = NH₃<sup>−</sup> + H<sup>+</sup>)</li><li>анионные (H₂PO₄ = HPO₄<sup>2-</sup> + H<sup>+</sup>)</li><li>нейтральные (HCl = H<sup>+</sup> + Cl)</li></ul>"}, {"n": 76, "q": "Классификация оснований согласно протолитической теории, примеры.", "a": "<ul class=\"src-list\"><li>нейтральные (Н₂O + H<sup>+</sup> ⇌ H₃O<sup>+</sup>; NH₃<sup>−</sup> + H<sup>+</sup> = NH₄<sup>+</sup>)</li><li>катионные (NH₂-NH₃ + H<sup>+</sup> ⇌ NH₃+-NH₃<sup>+</sup>)</li><li>анионные (OH<sup>−</sup> + H<sup>+</sup> ⇌ H₂O; H<sup>+</sup> + Cl<sup>−</sup> = HCl)</li></ul>"}, {"n": 77, "q": "Понятие о сопряжённой протолитической паре, примеры протолитических реакций.", "a": "<p>Кислота, отдавая протон, превращается в частицу, стремящуюся ее принять - сопряженное основание, совокупность кислоты и ее сопряженного основания - протолитическая пара</p><p>Основание, принимая протон, превращается в частицу, стремящуюся его отдать - сопряженная кислота. Совокупность основания и сопряж кислоты = протолитическая пара.</p><p>HCl + NH₃ = Cl<sup>−</sup> + NH₄<sup>+</sup></p><p>HCl - кислота</p><p>Сl<sup>−</sup> - сопряж основание</p><p>NH₃ - основание</p><p>NH₄ - сопряж кислота</p>"}, {"n": 78, "q": "Определение амфолита согласно протолитической теории, примеры.", "a": "<p><em>Амфолит </em>- донор и акцептор Н<sup>+</sup>, проявляет свойства кислоты или основания в зависимости от вещества с которым вступает в реакцию (H₂O, HSO₄<sup>−</sup>, CH₃COOH, H₂SO₄)</p>"}, {"n": 79, "q": "Обратимый процесс кислотно-основного взаимодействия. Показать на примере протолитических реакций.", "a": "<p>Многие электролиты, содержащие Н<sup>+</sup>, в одном растворе могут диссоциировать как кислоты, в другом как основания, например уксусная кислота в воде - слабая кислота, а плавиковая кислота - основание:</p><p>CH₃COOH +H₂O = CH₃COO<sup>−</sup> + H₃O<sup>+</sup></p><p>CH₃COOH + HF = CH₃COOH₂ + F<sup>−</sup></p><p>Исследование такого типа реакций привело к протолитической теории</p>"}, {"n": 80, "q": "Роль растворителя в протолитическом равновесии, влияние растворителя на свойства кислоты и основания.", "a": "<p>Растворитель влияет на проявление кислотных или основных свойств и их степень диссоциации, при этом сам растворитель выполняет функцию кислоты или основания(вода</p><ul class=\"src-list\"><li>амфолит). В полярных растворителях диссоциация усиливается из-за стабилизации ионов.</li></ul>"}, {"n": 81, "q": "Ионное произведение воды, расчет его значения по константе диссоциации воды.", "a": "<figure class=\"src-fig\"><img src=\"img/k1_18.webp\" alt=\"Иллюстрация к ответу\" loading=\"lazy\"></figure>"}, {"n": 82, "q": "Расчёт концентрации гидроксид - ионов по известной концентрации ионов водорода (пример).", "a": "<p>Пусть [H+] ⇌ 10<sup>-5</sup>, тогда рН = 5 рОН= 14 - 3 = 11 —&gt; [ОН-] = 10<sup>-11</sup></p>"}, {"n": 83, "q": "Понятие о водородном показателе. Приведите расчет на конкретном примере.", "a": "<p>рН = -lg[H+] для сильных кислот рН = 14-рОН (рОН =-lg[ОН-]) для сильных оснований</p><p>Если [Н+] = 10<sup>-3</sup>, то рН = lg10<sup>-3</sup> = 3</p>"}, {"n": 84, "q": "Связь между водородным и гидроксильным показателями реакции среды.", "a": "<p>рН+рОН = 14 (при 25 градусах), тк [Н+][ОН-]= 10<sup>-14</sup></p>"}, {"n": 85, "q": "Возможные значения рН, рОН, концентрации ионов водорода и гидроксид - ионов для нейтральной, кислой и щелочной среды.", "a": "<p>Кислая: рН &lt; 7, [Н+] &gt;10<sup>-7</sup> ; рОН &gt; 7, [ОН-] &lt;10<sup>-7</sup></p><p>Нейтральная: рН,рОН,[Н+],[ОН-] = 7</p><p>Щелочная: рН &gt; 7, [Н+]&lt;10<sup>-7</sup> ; рОН &lt; 7, [ОН-] &gt; 10<sup>-7</sup></p>"}, {"n": 86, "q": "Расчёт концентрации ионов водорода и гидроксид - ионов по и известному значению рН (пример).", "a": "<p>Пусть рН = 5, тогда [Н+] = 10<sup>-5</sup> pOH = 14 - 5 = 9 —&gt; [OH-] = 10<sup>-9</sup></p>"}, {"n": 87, "q": "Расчет рН в растворах сильных кислот и оснований.", "a": "<p>pH = -lg [H+] - кислота рН = 14- рОН (рОН = -lg[OH-]) - основание</p>"}, {"n": 88, "q": "Расчет рН в растворах слабых кислот и оснований.", "a": "<p>рН = 1/2рК - 1/2lgC - кислота рК = - lgКд к-ты рОН = 1/2рК - 1/2lgC - основание рК=-lgКд осн рН = 14-рОН</p>"}, {"n": 89, "q": "Активная, потенциальная и общая кислотность (сравните сильные и слабые кислоты).", "a": "<p>Активная - концентрация свободных ионов водорода в процессе диссоциации (зависит от степени диссоциации электролита)</p><p>Потенциальная - связанные ионы водороды (при повышении t и давления повышается концентрация ионов Н<sup>+</sup>)</p><p>Общая - исходная концентрация или сумма распавшихся или неспаренных молекул</p><p>А.к.HCl &gt; а.к.CH₃COOH</p><p>П.к HCl &lt; п.к.CH₃COOH</p><p>О.к. НСl = о.к. СН₃СООН</p>"}, {"n": 90, "q": "Понятие о кислотно - основном гомеостазе. Значения рН для различных жидкостей организма в норме.", "a": "<p>Гомеостаз - способность организма поддерживать постоянство внутренней среды рН - постоянная величина в различных биологических средах и она способна восстанавливаться</p><p>Желуд. сок - 0,9-1,1</p><p>Кровь - 7,35-7,45</p><p>Моча - 4,8 - 7,5</p><p>Слюна - 6,35-6,85</p>"}, {"n": 91, "q": "Роль водородного показателя в исследовательской и практической деятельности", "a": "<p>Определение рН нужно для функционального состояния организма, в лабораторной практике, к технологических процессах , производство медикаментов и в пищевых продуктах.</p>"}]}, {"id": "k1s2", "title": "Буферные системы", "items": [{"n": 92, "q": "Понятие о буферных системах. Значение и применение буф. систем", "a": "<p>Буферные системы - растворы, обладающие свойством относительно стойко сохранять значение рН при добавлении небольших порций кислот, оснований или при их разбавлении</p><p>Значение : поддержание постоянства рН живых организмов (рН крови, например);</p><p>обеспечение стабильности химических процессов(буферы предотвращают смещение равновесия)</p><p>Применение: в медицине при приготовлении растворов для биохимических исследований(фосфатный буфер), в фармацевтике для создания лекарств, где важно постоянство рН для сохранения активности препарата, в аналитической химии</p><p>(титриметрия)</p>"}, {"n": 93, "q": "Классификация буферных систем по компонентам. Примеры", "a": "<ul class=\"src-list\"><li class=\"num\"><span class=\"n\">1.</span> Кислотного типа (образованы слабой кислотой и солью этой кислоты сильного основания)</li></ul><p>СН₃СООН+СН₃СООK - ацетатный буфер</p><p>Н₂СО₃+NaHCO₃ - гидрокарбонатный буфер</p><ul class=\"src-list\"><li class=\"num\"><span class=\"n\">2.</span> Основного типа (образованы слабым основанием и солью этого основания сильной кислоты</li></ul><p>NH₄OH+NH₄CL</p><ul class=\"src-list\"><li class=\"num\"><span class=\"n\">3.</span> Солевого типа (анионы многоосновных кислот)</li></ul><p>K₂HPO₄<sup>+</sup> KH₂PO₄ - фосфатный буфер</p><p>Na₂CO₃+NaHCO₃ - карбонатный</p><ul class=\"src-list\"><li class=\"num\"><span class=\"n\">4.</span> Ионы и молекулы амфолитов (аминокислоты и белки)</li></ul>"}, {"n": 94, "q": "Механизм буферного действия на примере ацетатного буфера", "a": "<p>При добавлении кислоты, основания или разбавления буфера водой его рН меняется совсем незначительно, потому что эквивалентное количество слабой: СН₃СООNa+HCl=CH₃COOH+NaCl замещается на эквивалентное количество соли: СН₃СООН+NaOH=CH₃COONa+H₂O остается прежним</p>"}, {"n": 95, "q": "Уравнение для кислот", "a": "<p>рН=рК+lg[соль]/[к-та]</p>"}, {"n": 96, "q": "Уравнение для оснований", "a": "<p>рН=рК+lg[соль]/[основание]</p><p>Для 95 и 96: рН будет зависеть от константы диссоциации слабой к-ты или основания, от соотношения концентраций взятых растворов</p>"}, {"n": 97, "q": "Понятие о буферной ёмкости. Количественная характеристика буферной ёмкости", "a": "<p>Буферная ёмкость - количество моль эквивалентов сильной кислоты или основания, которое необходимо добавить к 1 литру буферной смеси, чтобы изменить рН на единицу.</p>"}, {"n": 98, "q": "Формулы буферной ёмкости для кислоты и основания:", "a": "<p>B= n1/z (к-ты/щёл)/ дельта рН*Vбуф. ёмкости</p>"}, {"n": 99, "q": "От каких факторов и как зависит буферная ёмкость? При каких условиях буферная ёмкость максимальна?", "a": "<p>кислоты и ее соли, тем выше буферная ёмкость, соответственно концентрированные буферы сильнее сопротивляются изменению рН)</p><p>будет максимальна. При значительном преобладании одного из компонентов способность к нейтрализации кислоты или щелочи резко снижается.</p><p>эффективная работа буфера сохраняется при рН= рКк-ты +-1 равновесия, те при изменении t буферные свойства могут ослабевать или усиливаться</p><p>Условия: буфер должен находиться в равной молярной или количественной концентрации, тогда рН=рКк-ты и система будет одинаково эффективно нейтрализовать и кислоты,и щелочи.</p>"}, {"n": 100, "q": "Рабочий участок буферной системы(зона буферного действия), его границы", "a": "<p>Рабочий участок б.с. - диапазон значений рН, в котором буфер эффективно сопротивляется изменению кислотности при добавлении небольших количеств кислоты или щелочи рН=рК+-1</p><p>Ацетатный буфер (рК=4,76) рабочая зона 3,76-5,76</p><p>Фосфатный буфер (рК=7,2) рабочая зона 6,2-8,2</p>"}, {"n": 101, "q": "Гидрокарбонатный буфер : H₂CO₃+NaHCO₃ - кислотный, рН=рКк-ты…", "a": "<p>Гидрокарбонатный буфер : H₂CO₃+NaHCO₃ - кислотный, рН=рКк-ты + lg [соль]/[к- та]</p><p>Аммиачный буфер: NH₄OH+NH₄Cl - основный, рОН=рКосн + lg[соль]/[основ]</p>", "derived": 1}, {"n": 102, "q": "Карбонатный буфер: Na₂CO₃(1)+NaHCO₃(2) - солевой, рН= рК(H₂CO₃)…", "a": "<p>Карбонатный буфер: Na₂CO₃(1)+NaHCO₃(2) - солевой, рН= рК(H₂CO₃) + lg C(1)/C(2)</p><p>Фосфатный буфер: Na₂HPO₄(1)+NaH₂PO₄(2) - солевой, рН=рК(H₃PO₄)+lg C(1)/C(2)</p>", "derived": 1}, {"n": 103, "q": "pH крови. Буферные системы крови, их относительный вклад в поддержание кисл- осн гомеостаза.", "a": "<p>рН=7,35-7,45, при отклонение значений наблюдается алкалоз или ацидоз, что нарушает работу ферментов, сократимость мышц, нервную проводимость и тд.</p><p>Буферные системы:</p><p>дыханием, образуется из компонентов буф. системы в крови из СО₂;</p><p>почках, чем плазме, важен для регуляции рН мочи система эритроцитов, основанная на способности гемоглобина(Hb) связывать Н<sup>+</sup> при переходе от оксигемоглобина к дезоксигемоглобину; при отдаче кислорода Нb связывает Н<sup>+</sup>, предотвращая ацидоз</p>"}, {"n": 104, "q": "Буферные системы плазмы крови, их относительный вклад в поддерж. кисл-осн гомеостаза (тот же ответ, что и", "a": "<ul class=\"src-list\"><li class=\"num\"><span class=\"n\">103)</span> </li></ul>"}, {"n": 105, "q": "рН внутренней среды эритроцитов. Буферные системы эритроцитов", "a": "<p>рН=7,25-7,30</p><p>Буфер - гемоглобин-оксигемоглобиновый (~10-15%); гидрокарбонатный (~18%), фосфатный(1%). Самыми важными являются гемоглобиновый и карбонатный буферы, тк они обеспечивают транспорт СО₂ и стабилизацию рН</p>"}, {"n": 106, "q": "Н₂СО₃+NaHCO₃ рН=рК+lg[соль]/[к-та]", "a": "<p>Н₂СО₃+NaHCO₃ рН=рК+lg[соль]/[к-та]</p><p>Тк, этот буфер регулирует концентрацию СО₂, в крови он определяется коэффициентом растворимости при 37С и парциальным давлением рСО2 (Н2СО3=С*рСО2)</p>", "derived": 1}, {"n": 107, "q": "Роль дыхания в поддержании кисл-осн гомеостаза", "a": "<p>Дыхание регулирует концентрацию летучей кислоты (СО2-Н₂СО₃). Регуляция происходит через вентиляцию легких, где при увеличении вентиляции выводится больше СО₂, след.</p><p>парц.давл.СО₂ падает вместе с [Н+] и повышается рН, что приводит к респираторному алкалозу. При уменьшении вентиляции, повышается рСО2 вместе с [Н+], рН падает и наступает респираторный ацидоз.</p>"}, {"n": 108, "q": "Механизм действия гем-оксигем буфера", "a": "<p>Гемоглобин и оксигемоглобин - слабые кислоты, но окисляются сильнее.</p><p>Механизм связан с дых системой. В венозной крови преобладает ННb. В лёгких к гемоглобину присоединяется кислород и он превращается в оксигемоглобин ( более сильную кислоту), но изменения рН не происходит, так как в это время из крови в легкие выделяется СO₂ и образуется Н₂СО₃.</p><p>Артериальная кровь поступает в ткань, в них оксигемоглобин отдавая кислород превращается в НHb (более слабую кислоту), но рН не изменяется так как в это время в кровь поступает СО₂, который растворяется в воде с образованием Н₂СO₃.</p>"}, {"n": 109, "q": "Значение фосфатного буфера для разных сред организма", "a": "<p>Фосфатный буфер играет большую роль в тканях, почках и моче для удаления избытка кислот и поддерж. рН и внутриклеточных жидкостях, в крови находится в соотношении</p><p>Na₂HPO₄/NaH₂PO₄=3,5</p>"}, {"n": 110, "q": "Белковая буферная система, механизм его действия, сравнительная ёмкость по кислоте и щёлочи. Характеристика буферного действия свободных аминокислот в организме.", "a": "<p>Белковая буф система представлена в организме в виде форм: белок - соль, белок- кислота(буфер кислотного типа), белок-основ.(работает по акцепторному принципу)</p><p>Буферная ёмкость по кислоте больше, чем по щелочи, тк в крови преобладает больше</p><p>HCO₃<sup>−</sup> (основания), чем угольной кислоты.</p><p>Если а/к или белки находятся в изоэлектрическом состоянии, то их растворы не являются буферами. Они начинают проявлять буферные действия, когда к ним добавляют некоторое кол-во кислоты или щелочи.</p>"}, {"n": 111, "q": "Алкалоз и ацидоз (компенсированный и некомпенсированный)", "a": "<p>Изменение буферной ёмкости по щёлочи - алкалоз</p><p>Изменение буферной ёмкости по кислоте - ацидоз.</p><p><em>Компенсированный алкалоз </em>- нарушение равновесия, при котором рН крови удерживается в пределах от 7,35-7,45 и отмечается лишь сдвиг физических регуляторных механизмов(дыхательная, почечная).</p><p><em>Некомпенсированный алкалоз </em>- при этом рН превышает 7,45 что обычно связано с избытком щелочи и недостаточностью физико-химических и физиологических механизмов регуляции.</p><p><em>Компенсированный ацидоз </em>- рН в крови не опускается ниже границы физиологической нормы 7,35 при этом усиливается сердцебиение и повышается кровяное давление.</p><p><em>Некомпенсированный ацидоз </em>-рН ниже физиологической нормы (7,35).При этом наблюдаются расстройство ЦНС, сердечно-сосудистой системы и желудочно-кишечного тракта.</p><p>изменение рН на 0,6 единиц приводит к летальному исходу.</p>"}, {"n": 112, "q": "Понятие о метаболическом и респираторном алкалозе, ацидозе", "a": "<p>Метаболические нарушения связаны с изменением [HCO₃⁻].</p><p>Респираторные нарушения связаны с изменением pCO₂.</p><p><em>Метаболический алкалоз </em>- нарушение гомеостаза за счёт патологических изменений, связанных с нарушением обмена электролитов (гемолиз) - разрушение стенок эритроцитов и высвобождение гемоглобина в биологические жидкости.</p><p><em>Респираторный алкалоз </em>- нарушение за счёт избытка основания, в результате гипервентиляции легких, которая приводит к избыточному выведению CO₂ из организма и нарушению парциального давления СO₂ в крови.</p><p><em>Метаболический ацидоз </em>- смещение гомеостаза в результате накопления кислых продуктов в тканях, недостаточного их связывания или разрушения.</p><p>Респираторный ацидоз - возникает при гиповентиляции лёгких или вдыхании воздуха с повышенной концентрацией СО₂.</p>"}, {"n": 113, "q": "метаболический ацидоз - гидрокарбонат натрия (4,5% р-р…", "a": "<p>метаболический ацидоз - гидрокарбонат натрия (4,5% р-р 200мл) вводят внутривенно при диабете, инфекциях, в тяжелых случаях 100мл 8,5% <em>респираторный ацидоз </em>- главная задача устранить гиповентиляцию (ИВЛ, муколитики, антибактериальные препараты (при пневмонии))</p><p><em>метаболический алкалоз </em>- введение внутривенно 0,9% раствора NaCl, для снижения реабсорбции HCO₃<sup>−</sup>, восполнения объема и хлоридов, введение внутрь или внутривенно аскорбиновой кислоты (5%р-р)</p><p><em>респираторный алкалоз </em>- главная задача снизить гипервентиляцию (на психической основе - седативные, на большой высоте при гипоксии - гипербарическая оксигенация(барокамера).</p>", "derived": 1}]}, {"id": "k1s3", "title": "Растворы и коллигативные свойства", "items": [{"n": 114, "q": "Охарактеризуйте понятия: раствор, компоненты раствора.", "a": "<p><em>Раствор </em>- гомогенная система, состоящая из 2х или более компонентов, в которой вещества распределены на молекулярном, атомном или ионном уровнях. <em>Компоненты раствора</em>:</p><p>растворитель (вещество в избытке), растворенное вещество (частицы которого распределяются в растворителе, может быть твердым, жидким или газообразным)</p>"}, {"n": 115, "q": "Охарактеризуйте свойства воды как растворителя.", "a": "<ul class=\"src-list\"><li class=\"num\"><span class=\"n\">1.</span> Полярность молекулы</li></ul><p>(кислород сильнее тянет электроны - молекула становится диполем, что позволяет эффективно растворять полярные вещества) 2. Способность к гидратации и образованию водородных связей. 3. Высокая диэлектрическая проницаемость</p><p>(ослабляет силы притяжения между ионами) 4. Амфотерность 5. Растворимость газов 6. Ограниченность как растворителя (плохо растворяет неполярные вещества</p><p>(жиры,масла,углеводы), тк между ними нет электростатического взаимодействия)</p>"}, {"n": 116, "q": "Влияние на растворимость природы компонентов. Полярные и неполярные", "a": "<p>растворители. <em>На растворимость влияют: </em>1. Природа вещества 2. Природа растворителя 3. Соответствие природы компонентов (неполярные вещества в неполярных растворителях (жиры в бензоле, эфире, гексане; Полярный раств- ль+полярное вещество NaCl+вода). 4. Температура (для твердых и жидких веществ растворимость увелич, а для газов уменьшается) 5. Давление (значительно влияет только для газов); <em>Полярные вещ-ва </em>- состоят из молекул с электрическим диполем, где заряды внутри распределены неравномерно, хорошо растворяют ионные соединения. <em>Неполярные </em>- заряды внутри распределены равномерно, соответственно нет диполей, плохо растворяют ионные и полярные соединения.</p>"}, {"n": 117, "q": "Тепловые эффекты процессов растворения газов, жидких и твердых веществ.", "a": "<p><em>При растворении газов </em>всегда реакции с выделением тепла - экзотермические. <em>При</em> <em>растворении жидких веществ </em>тепло выделяют полярные вещества в воде</p><p>(спирт+вода), неполярные почти не растворяются, поэтому тепловой эффект мал.</p><p><em>При растворении твердых веществ</em>: если происходит разрушение кристаллической решетки (KNO₃, NH₄NO₃), реакция эндотермическая с затратой тепла, когда происходит гидратация ионов - экзотермическая (сильные щелочи и электролиты).</p>"}, {"n": 118, "q": "Термодинамика процесса растворения. Энтропийный и энтальпийный факторы процессов растворения твердых, жидких и газообразных веществ в жидкостях.", "a": "<p>Растворение — это процесс, при котором исходное вещество (твёрдое, жидкое или газ) распределяется в растворителе. Его термодинамика определяется величиной <em>изменения энергии Гиббса</em>: дельтаG = дельтаH - T*дельтаS, где:</p><ul class=\"src-list\"><li>ΔH — энтальпия (тепловой эффект),</li><li>ΔS — энтропия (изменение упорядоченности системы),</li><li>ΔG &lt; 0 → процесс идёт самопроизвольно.</li></ul><p><em>Энтальпийный и энтропийный фактор</em></p><ul class=\"src-list\"><li class=\"num\"><span class=\"n\">1.</span> Растворение твёрдых веществ (солей, кристаллов)</em></li><li><em>Энтальпия (ΔH)</em>: зависит от баланса между энергией разрушения решётки</li></ul><p>(эндотермично) и энергией гидратации (экзотермично). Может быть как &gt;0, так и &lt;0.</p><ul class=\"src-list\"><li><em>Энтропия (ΔS)</em>: обычно увеличивается, т.к. упорядоченный кристалл превращается в более хаотичный раствор (ΔS &gt; 0).</li><li><em>Итог</em>: растворение часто самопроизвольно даже при эндотермичном ΔH (например,</li></ul><p>KNO₃), потому что выигрывает энтропийный фактор.</p><ul class=\"src-list\"><li class=\"num\"><span class=\"n\">2.</span> Растворение жидкостей</em></li><li><em>Энтальпия (ΔH)</em>: мала, зависит от природы жидкостей (полярные ↔ полярные — обычно</li></ul><p>ΔH &lt; 0; неполярные ↔ вода — ΔH &gt; 0).</p><ul class=\"src-list\"><li><em>Энтропия (ΔS)</em>: растёт, если жидкости хорошо смешиваются (образуется более хаотичная система).</li><li><em>Итог</em>: растворение полярных жидкостей в воде идёт легко.</li><li class=\"num\"><span class=\"n\">3.</span> Растворение газов</em></li><li><em>Энтальпия (ΔH)</em>: почти всегда отрицательная (экзотермичное растворение).</li><li><em>Энтропия (ΔS): </em>уменьшается (ΔS &lt; 0), так как свободные молекулы газа становятся более упорядоченными в жидкости.</li><li><em>Итог</em>: растворимость газов выгодна при низких температурах, но уменьшается при нагревании (энтропийный фактор начинает мешать).</li></ul>"}, {"n": 119, "q": "Влияние температуры на растворимость веществ.", "a": "<p>Твердые вещества:</p><p>растворимость многих солей растет с температурой (эндотермич.), но у</p><p>Na₂SO₄*10H₂O, Ca(OH)₂ растворимость с нагревом меньше. Газы: почти всегда растворяются экзотермический и при повышении Т растворимость падает. Жидкие вещества: если хорошо смешивается с водой, то растворимость почти не зависит от</p><p>Т; Если плохо смешиваются с водой (фенолы, некоторые орг.к-ты), зависимость от Т может быть заметнее.</p>"}, {"n": 120, "q": "Влияние различных факторов на растворимость газов в жидкостях.", "a": "<ul class=\"src-list\"><li class=\"num\"><span class=\"n\">1.</span> При увеличении температуры растворимость газов снижается 2. Повышение давление повышает растворимость газов 3. Растворимость газов в жидкостях, в присутствии электролитов , снижает их растворимость, тк происходит «высаливание» газов 4.</li></ul><p>Полярные газы лучше растворяются в полярных раств-лях(SO₂, NH₃ в воде), неполярные - в неполярных (О2 в жирах)</p>"}, {"n": 121, "q": "Законы Генри и Дальтона.", "a": "<p><em>Закон Генри </em>- количество газа, растворенного при данной температуре растворителя в определенном объеме жидкости, при равновесии прямо пропорционально давлению газа. С = Кг*Р , где Р<sup>−</sup> давление газа над растворителем, Кг - постоянная Генри. <em>Закон Дальтона </em>- растворимость каждого из компонентов газовой смеси при постоянной температуре, пропорциональна парциальному давлению компонентов над жидкостью и не зависит от общего давления смеси.</p>"}, {"n": 122, "q": "Закон Сеченова. Механизм влияния электролитов на растворимость газов.", "a": "<p>Закон</p><p>Сеченова: растворимость газов в жидкостях в присутствии электролитов понижается</p><p>С = Со*е<sup>-</sup>Кс-Сэ. При растворении газов, происходит «высаливание», потому что: 1.</p><p>при растворении электролита, его катионы и анионы сильно гидратируются, тем самым уменьшая количество свободных молекул растворителя, которые могли бы взаимодействовать и растворять газ. 2. Электростатическое поле гидратированных ионов стабилизирует структуру воды, делая менее благоприятной для внедрения нейтральных молекул газа, тем самым «выталкивая» газ из раствора</p>"}, {"n": 123, "q": "Физико-химические основы развития кессонной болезни.", "a": "<p>Болезнь, связанная с перепадом давления («болезнь водолазов»), растворимость газов может повышаться в 4 раза при глубоком погружении. При резком подъеме с глубины может произойти эмболия, когда О₂ не может нормально раствориться из-за резкого сниженного давления, тем самым в крови образуются пузырьки, которые могут закупоривать мелкие сосуды, что может привести к смерти.</p>"}, {"n": 124, "q": "Сущность гипербарической оксигенации, её применение.", "a": "<p>Гипербар.оксигенация - насыщение тканей О₂ в специальной барокамере с повышенным давлением. Применяется при кессонной болезни, респираторном ацидозе, ишемическом инсульте, при отравлении угарным газов</p>"}, {"n": 125, "q": "Понятие идеального раствора.", "a": "<p>Идеальный раствор - при его образовании, не происходит изменение объема и теплового эффекта. Движущая сила образования идеального раствора - увеличение энтропии. Примерами таких растворов являются:</p><p>р-ры близких по природе жидкостей (бензол+толуол; хлорбензол + бромбензол);</p><p>растворы изомеров; газовые смеси</p>"}, {"n": 126, "q": "Что называется диффузией? Чем обусловлен этот процесс?", "a": "<p>Диффузия - самопроизвольный перенос вещества из области с большей концентрации в область с меньшей, в результате которого устанавливается равновесие. Процесс обусловлен беспорядочным тепловым движением частиц, движущая сила - увеличение энтропии, с переносом молекул вещества происходит перенос молекул растворителя.</p>"}, {"n": 127, "q": "Закон Фика для скорости диффузии. Математическое выражение, анализ", "a": "<p>уравнения. Закон Фика - скорость диффузии вещества пропорциональна площади поверхности, через которое переносится вещество, и градиенту концентрации этого вещества. дельтаm=DS*(дельтаС/дельтаХ)*Т, где дельтаm - масса дифф.вещ-ва; D - коэфф.диффузии; S - площадь переноса; Т - время диффузии; дельтаС/дельтаХ - градиент концентрации</p>"}, {"n": 128, "q": "Математическое выражение коэффициента диффузии. Анализ уравнения.", "a": "<p>Коэффициент диффузии - определяет собой количество вещества , продифф. через единицу поверхности и через единицу времени при градиенте концентрации равном единице. Д= (RT/Na)*(1/6Пиrn), n - вязкость растворителя.</p>"}, {"n": 129, "q": "Значение диффузии в биологических процессах.", "a": "<ul class=\"src-list\"><li class=\"num\"><span class=\"n\">1.</span> Всасывание питательных веществ из просвета кишечника в кровь; 2. Поступление питательных веществ из крови в ткани; 3. Выделение продуктов обмена веществ из тканей через почки, легкие, кишечник 4. Распределение в организме лекарственных и ядовитых веществ, поступающих извне.</li></ul>"}, {"n": 130, "q": "Сущность пассивного транспорта веществ, облегчённой диффузии, активного", "a": "<p>транспорта. <em>Пассивный транспорт </em>- перенос вещества по градиенту концентрации без затрат энергии (низкомолекулярные соединения). <em>Облегченная диффузия </em>- перемещение вещества по градиенту концентрации, но с затратой энергии</p><p>(глюкоза). <em>Активный транспорт </em>- перемещение вещества против градиента концентрации с затратой энергии (K-Na насос)</p>"}, {"n": 131, "q": "Перечислите коллигативные свойства растворов. Чем они обусловлены?", "a": "<p>Коллигативные свойства зависят не от природы вещества растворителя, а от концентрации частиц в растворе. Обусловлены: 1. Осмотическим давлением 2.</p><p>Понижением давления пара 3. Понижением температуры замерзания 4.</p><p>Повышением температуры кипения</p>"}, {"n": 132, "q": "Понятие о насыщенном паре. Охарактеризуйте состояние системы.", "a": "<p><em>Насыщенный пар </em>- пар, находящийся в термодинамическом равновесии со своей жидкостью (или твердым телом) при данном равновесии. <em>Характеристики</em>: 1.</p><p>Равновесие (система находится в равновесии, молекулы переходят из жидкости в пар и обратно с одинаковой скоростью) 2. Изотермичность (давление пара зависит только от температуры, объем и количество жидкости не влияет) 3. Предельность</p><p>(если в систему при той же температуре добавить еще пар, то он будет конденсироваться, сохраняя давление постоянным) 4. Чувствительность к температуре ( с ростом Т давление насыщенного пара резко увеличивается)</p>"}, {"n": 133, "q": "Закон Рауля относительно понижения давления насыщенного пара.", "a": "<p>Математическое выражение, анализ уравнения. Закон Рауля - относительное понижение давления насыщенного пара над раствором прямо пропорционально мольной доли раствора. Р₀-Р/Р₀=N, где N - мольная доля, Р₀ - давление пара над чистым растворителем, Р - давление пара над общим раствором.</p>"}, {"n": 134, "q": "Объясните снижение давления насыщенного пара растворителя над раство-", "a": "<p>ром. Растворы кипят при более высокой Т, чем чистый растворитель. Тк давление пара над раствором всегда ниже, чем над чистым растворителем, раствор нужно хорошо нагреть, чтобы давление насыщенного пара над раствором приравнивается к атмосферному</p>"}, {"n": 135, "q": "Закон Рауля относительно повышения температуры кипения и понижения температуры замерзания растворов. Математические выражения.", "a": "<p>дельтаТкип.=Е*См, где Е эбулиоскопическая постоянная (для воды 0,52),См - моляльность; дельтаТзам. = К*См, где К<sup>−</sup> криоскопическая постоянная (для воды</p><p>1,86), См - моляльность</p>"}, {"n": 136, "q": "Объясните повышение температуры кипения растворов.", "a": "<p>Кипение раствора начинается тогда, когда давление насыщенного пара жидкости равняется атмосферному и чтобы это давление сравнялось, раствор нужно сильнее нагреть.</p><p>При добавлении не летучих веществ (соль, сахар и тд), часть поверхности занимают эти частицы растворенного вещества, молекулам растворителя труднее переходить в пар, следовательно давление насыщенного пара становиться меньше, чем у растворителя при той же температуре.</p>"}, {"n": 137, "q": "Объясните понижение температуры замерзания растворов.", "a": "<p>Главная суть замерзания - это установления равновесия жидкость-кристалл. Если добавить в растворитель не летучие частицы(сахар, соль и тд), они будут «вставать» между молекулами растворителя, нарушать их упорядоченное расположение и препятствовать образованию кристаллической решетки, для этого молекулам нужно сильнее сблизиться, чтобы растворитель закристаллизовался, а это возможно при более низких Т, чем при Т чистого растворителя.</p>"}, {"n": 138, "q": "Физический смысл эбулиоскопической и криоскопической констант. Расчёт молекулярной массы вещества по температурам кипения и замерзания раствора.", "a": "<p>Эбулиоскопическая константа - во сколько раз произошло повышение Т кипения раствора содержащего 1 моль вещ-ва в 1000г растворителя. М = Е*m*1000/ дельтаtкип*mр-ля); Криоскопическая - во сколько раз произошло понижение Т замерзания раствора, содержащего 1 моль вещества в 1000г растворителя. М =</p><p>К*m*1000/дельтаtзам*mр-ля)</p>"}, {"n": 139, "q": "Понятие об осмосе. Движущая сила процесса.", "a": "<p>Осмос - самопроизвольная односторонняя диффузия концентраций через полупроницаемый мембрану из области меньше концентрации в область большей. Движущая сила - уравнять химический потенциал по обе стороны мембраны с помощью растворителя.</p>"}, {"n": 140, "q": "Понятие о полупроницаемых мембранах, их виды.", "a": "<p>Полупроницаемая мембрана способна пропускать в большей степени молекулы растворителя и не пропускает молекулы растворенного вещества. Виды: Биологические (клеточная мембрана, стенки капилляров), искусственные (целлюлозные, керамические, полимерные пленки)</p>"}, {"n": 141, "q": "Осмотическое давление. Закон Вант - Гоффа. Анализ уравнения.", "a": "<p><em>Осмотическое</em> <em>давление </em>- гидростатическое давление, которое нужно приложить к раствору, чтобы удержать осмос(движ.сила - увеличение энтропии). <em>Закон Вант-Гоффа</em>:</p><p>осмотическое давление разбавленных не электролитов равно тому газовому давлению, которое производило бы растворенное вещество, если бы оно было в виде газа и занимало тот же объем, что и раствор. П = СRT, где П - осмотическое давление, R-универсальная газовая постоянная (8,314), Т - абсолютная температура</p>"}, {"n": 142, "q": "Понятие об осмомолярности и осмомоляльности. Осмометрия.", "a": "<p>Осмомолярность - общее число осмотически активных молекул в 1л раствора, объем изменяется при изменении Т. Осмомоляльность - общее число осмотически активных молекул в 1кг растворителя, не зависит от Т, тк масса растворителя постоянна. Осмометрия - метод определения осмотического давления растворов через их коллигативные свойства (ебулиоскопиеская осмометрия, криоскопическая осмометрия, измерение давления через полупроницаемую мембрану)</p>"}, {"n": 143, "q": "Понятие об изотонических растворах. Осмотическое давление крови человека.", "a": "<p>Физиологический раствор. <em>Изотонический раствор </em>при одинаковых условиях обладает одинаковым осмотическим давлением, как и в биологических жидкостях.</p><p><em>Давление крови </em>= 7,6атм(~770кПа), белки плазмы крови не проходят через клеточную мембрану, но имеют способность выдерживать определенное количество воды - создаются условия для перехода жидкости из ткани в кровь; При нарушении белкового обмена, снижается концентрация белка в крови, что приводит к онкотическим отекам. <em>Физиологический раствор </em>- 0,9% NaCl и 5% глюкоза</p><p>(используются при кровопотерях, для введения лекарственных препаратов инъекционно, для промывания слизистых и снятия интоксикации)</p>"}, {"n": 144, "q": "Понятие о гипотонических и гипертонических растворах. Применение", "a": "<p>гипертонических растворов. <em>Гипотонический</em>-осмотическое давление ниже осм.давления внутриклеточных жидкостей; <em>Гипертонический </em>- осм.давление выше, чем во внутриклеточных жидкостях; <em>Применяется гипертон.р-р. </em>для снижения отёков, тк они «вытягивают» жидкость из тканей, при глаукоме внутривенно, слабительные препараты(магнезия, Na₂SO₄*10H₂O), как питательные растворы</p><p>(конц.глюкоза), лечебное действие морской воды.</p>"}, {"n": 145, "q": "Биологическая роль осмоса. Тургор, плазмолиз, лизис.", "a": "<p><em>Тургор </em>- упругое состояние клеток, обусловленное повышенным осмотическим давлением, способствующее сохранению тканям определений формы. <em>Плазмолиз </em>- клетки, попадая в гипертонический раствор, сморщиваются, тк вся вода из них выходит.</p><p><em>Лизис </em>- клетка, попадая в гипотонический раствор, набухает, вплоть до разрыва оболочки, тк в нее попадает вода. <em>Значение</em>: поддержание формы клеток, регуляция поступления воды в клетки и межклеточные жидкости, фильтрация и всасывание в организме, защитная функция (осмотическое давление может разрушать микроорганизмы)</p>"}, {"n": 146, "q": "Физико-химические основы действия солевых слабительных.", "a": "<p>Тк эти слабительные будут являются гипертоническими растворами, в результате их действия, устремляется большое количество воды в просвете кишечника через слизистую оболочку, увеличивают объемы содержимого, раздражают рецепторы, тем самым усиливают перистальтику кишечника и слабительный эффект.</p>"}, {"n": 147, "q": "Онкотическое давление, его биологическое значение.", "a": "<p><em>Онкотическое давление </em>- часть осмотического давления крови, создаваемого белками(0,04атм). Белки плазмы крови не проходят через клеточную мембрану, но имеют способность выдерживать определенное количество воды - создаются условия для перехода жидкости из ткани в кровь; При нарушении белкового обмена, снижается концентрация белка в крови, что приводит к онкотическим отекам.</p>"}, {"n": 148, "q": "Как и почему отличаются коллигативные свойства растворов электролитов и неэлектролитов.", "a": "<p>Коллигативные свойства растворов электролитов больше, чем у неэлектролитов, потому что электролиты при растворении диссоциируют на ионы, а неэлектролиты — нет.</p><p>В результате в растворе электролитов образуется больше частиц, поэтому эффекты</p><p>(осмотическое давление, повышение температуры кипения, понижение точки замерзания, понижение давление пара р-ля) выражены сильнее, кипят при более высоких температурах, замерзают при более низких и имеет осм. давление выше, чем у неэлектролитов.</p><p>Для учёта этого используют фактор Вант-Гоффа П=iCRT(дельтаtкип=iE*Cm/ дельтаtзам=iK*Cm), i - число частиц, которые распадаются в 1 молекуле вещества, Сm - моляльность. Фактор показывает, во сколько раз число частиц больше по сравнению с неэлектролитом.</p>"}, {"n": 149, "q": "Изотонический коэффициент, физический смысл, его применение для расчета коллигативных свойств электролитов", "a": "<p>Изотонический коэффициент показывает во сколько раз осмотич. давление раствора электролита больше теоретически вычисленного для раствора неэлектролита i = Посм опытное/Посм рассчит. = делtкип опыт/делtкип рассчит = делtзам опыт/делtзам рассчит</p><p>П=iCRT(дельтаtкип=iE*Cm/дельтаtзам=iK*Cm)</p>"}]}, {"id": "k1s4", "title": "Электролиты", "items": [{"n": 150, "q": "Сильные и слабые электролиты, примеры. Степень диссоциации. Какие факторы и как влияют на степень диссоциации", "a": "<p>Сильные - хорошо проводят эл.ток и полностью диссоциируют на ионы (HCl, KOH, NaCl);</p><p>Слабые - слабо проводят эл.ток и частично диссоциируют на ионы (H₂CO₃, NH₄OH).</p><p>Степень диссоциации: альфа = кол-во продиссоц. молекул/общее кол-во молекул в р-ре ,</p><p>% альфа &gt;30% - сильный электролит; &lt;3% - слабые электролиты; = 3-30% - средние электролиты (HF,H₃PO₄)</p><p>Факторы: 1. Природа растворенного вещества(сильные электролиты - альфа больше, слабые - меньше); 2. Температура(обычно при нагревании альфа растет); 3. Концентрация раствора(при разбавлении альфа растет); 4. От природы растворителя (в полярных растворителях альфа выше) 5. Наличие других электролитов (альфа падает при добавлении ионов того же типа)</p>"}, {"n": 151, "q": "Константа диссоциации. Какие факторы влияют на константу диссоциации", "a": "<p>Константа равновесия, отвечающая за диссоциацию слабого электролита</p><p>V₁= K₁[CH₃COOH], V₂=K₂[CH₃COO-][H+]; V₁=V₂</p><p>Кд=[CH₃COO-][H+]/ [CH₃COOH]</p><p>Константа зависит от природы электролита, растворителя и от t, но не зависит от концентрации раствора</p>"}, {"n": 152, "q": "Закон разведения Оствальда. Формулировка, математическое выражение", "a": "<p>Зависимость степени диссоциации слабого электролита от концентрации раствора</p><p>Для слабых электролитов: Кд=Са<sup>2</sup>/1-а; Для слабых электролитов 1-а~1, а&lt;0,03 -&gt;</p><p>(1-0,03)~1</p><p>=&gt;Кд=Са<sup>2</sup>. При разведении раствора слабого электролита, его степень диссоциации увеличивается.</p>"}, {"n": 153, "q": "Сущность теории сильных электролитов", "a": "<ul class=\"src-list\"><li class=\"num\"><span class=\"n\">1.</span> В водных растворах сильные электролиты диссоциируют почти полностью</li><li class=\"num\"><span class=\"n\">2.</span> В растворах сильных электролитов большая концентрация ионов</li><li class=\"num\"><span class=\"n\">3.</span> Расстояние между отдельными ионами невелико, между ними действуют силы межионного взаимодействия</li><li class=\"num\"><span class=\"n\">4.</span> Каждый ион в растворе сильного электролита будет окружен ионной сферой с противовоположным зарядом. Ион. сфера затрудняет движение иона</li><li class=\"num\"><span class=\"n\">5.</span> Диссоциация многих сильных электролитов не только полная, но и необратимая</li></ul>"}, {"n": 154, "q": "Объясните, почему для растворов сильных электролитов применяют понятие «кажущая степень диссоциации»", "a": "<p>Из-за межионного взаимодействия кажется, что в растворе активно меньше частиц, чем это есть на на самом деле и закон разбавления Оствальда для них неприменим.</p><p>Кажущаяся степень диссоциации учитывает активные ионы, которые принимают участие в химических и физических процессах, фактическое поведение ионов в растворе</p>"}, {"n": 155, "q": "Понятие об активности ионов. Коэффициент активности", "a": "<p>Эффективная условная концентрация иона, соответственно которой он действует при химических реакциях а=f*Cm, где f - коэффициент активности , См- моляльность, а - активность иона</p><ul class=\"src-list\"><li>Коэфф активности показывает отклонение реального поведения иона от теоретически рассчитанного</li><li>От разбавления f=1, a=C</li><li>У сильных ионов электролитов возможно С=&lt;0,0001 моль/л</li><li>При очень больших концентрациях растворов некоторых электролитов f может быть больше 1, а&gt;С. Это объясняется нехваткой молекул растворителя для гидратации ионов и резким увеличением подвижности ионов</li></ul>"}, {"n": 156, "q": "Ионная сила раствора. Расчет на конкретном примере", "a": "<p>Величина, измеряемая полусуммой произведений концентрации каждого иона на квадрат его заряда</p><p>I= 1/2*(C₁*Z₁<sup>2+</sup>C₂*Z₂<sup>2+</sup>…)</p><p>NaCl -&gt; Na<sup>+</sup> + Cl<sup>−</sup></p><p>I = 1/2(0,01*(1+)<sup>2+</sup>0,01*(-1)<sup>2</sup>= 0,01</p><p>Для разбавленных р-ов формула дебая-хюккеля lgf=-0,5*Z<sup>2</sup>*корень I</p><p>Закон: в разбавленных растворах сильных электролитов с одинаковой ионной силой, коэффициент активности катионов и анионов одинаковой зарядности равны, не зависимо от их химической природы.</p>"}, {"n": 157, "q": "Эффект Доннана", "a": "<p>Явление неравномерного распределния Ионов через полупроницаемую мембрану, если по одной сторону есть недиффундирующие</p><p>(заряженные) ионы , в следствие этого равновесие концентраций по обе стороны не устанавливается и возникат разность потенциалов</p>"}]}, {"id": "k1s5", "title": "Концентрации растворов", "items": [{"n": 158, "q": "Массовая доля, мольная (молярная) доля растворённого вещества в растворе (определение, формулы для расчёта).", "a": "<p>Массовая доля - отношение массы вещества к массе всего раствора или смеси w = m / m * 100% w = m/V×p × 100%</p><p>Мольная доля - отношение числа моль растворенного вещества к сумме молей всех компонентов в растворе</p><p>Nв-ва/р-ля = n(в-ва/р-ля)/n(в-ва/р-ля) + n(в-ва/р-ля)</p>"}, {"n": 159, "q": "Молярная концентрация, моляльная концентрация (определение, формулы для расчёта).", "a": "<p><em>Молярная концентрация </em>- количество моль вещества в 1 л р-ра</p><p>Cm=n/V; Cm=m/(M*V(л)); Cm m*1000/M*V(мл); Cm (10*w%*p)/M</p><p><em>Моляльная концентрация (моляльность) </em>- показывает сколько моль растворённого в-ва содержится в 1 кг растворителя</p><p>Cm=m×1000/M×mр-ля</p>"}, {"n": 160, "q": "Понятие химического эквивалента вещества в обменных и в окислительно- восстановительных реакциях. Примеры.", "a": "<p><em>Химический эквивалент (z) </em>- реальная или условная частица вещества, которая в обменной реакции эквивалента равна 1 протону, а в ОВР 1 электрону</p><p>В обменных реакциях:</p><p>Кислоты: эквивалент равен числу протонов водорода</p><p>Основания: эквивалент равен числу гидроксильных групп</p><p>Соли: эквивалент равен числу атомов металла умноженные на валентность металла в этой соли</p><p>ОВР:</p><p>Окислитель: эквивалент равен числу электронов, принятых одним молем окислителя</p><p>Восстановитель: эквивалент равен числу электронов, отданных одним молем восстановителя</p>"}, {"n": 161, "q": "Молярная масса эквивалента вещества (определение, размерность). Расчёт молярной массы эквивалента кислоты, основания, соли в реакциях обмена.", "a": "<p>Молярная масса эквивалента вещества - масса одного моля эквивалентов данного вещества (г/моль экв.)</p><p>M₁/z = Mв-ва/z</p><p>H₂SO₄ M₁/z=98/2=49 г/моль*экв</p><p>Al(OH)₃ M₁/z=78/3 = 26 г/моль*экв</p><p>CaCl₂ M₁/z=111/2 = 55,5 г/моль*экв</p>"}, {"n": 162, "q": "Рассчитайте молярную массу эквивалента фосфорной кислоты, гидроксида кальция, сульфата алюминия в конкретных реакциях обмена.", "a": "<p>H₃PO₄ M₁/z=98/3 = 32 г/моль*экв НзРО4 + 3NaOH → Na₃P₀₄ + 3H₂₀</p><p>Ca(OH)₂ M₁/z=74/2 = 37 г/моль*экв Cа(OH)₂ + 2HCI → CaCl + 2H₂O</p><p>Al₂(SO₄)₃ M₁/z=342/6 = 57 г/моль*экв Al₂(SO₄)з + 6NaOH → 2AI(OH)₃ + 3Na₂SO₄</p>"}, {"n": 163, "q": "Молярная концентрация эквивалента (определение, формула для расчёта).", "a": "<p><em>Молярная концентрация эквивалента </em>- количество моль эквивалента вещества в 1 л раствора</p><p>C₁/z=n1/z/V; C₁/z=m/(M₁/z*V(л)); C₁/z (m*1000)/(M₁/z*V(мл)); C₁/z (10*w%*p)/M₁/z</p>"}, {"n": 164, "q": "Титр (определение, формула для расчёта). Соотношение между титром и молярной концентрацией эквивалента.", "a": "<p><em>Титр </em>- отношение массы растворённого вещества в г к объёму раствора в мл</p><p>T=m/V; T=(w%p)/100</p><p>T=(C₁/z×M₁/z)/1000</p>"}, {"n": 165, "q": "Соотношения между массовой долей растворённого вещества и молярной концентрацией, молярной концентрацией эквивалента.", "a": "<p>Соотношения между массовой долей и молярной концентрацией:</p><p>Cm = (w%•p• 10)/M</p><p>Соотношения между массовой долей и молярной концентрацией эквивалента:</p><p>C₁/z (w%*p*10)/M₁/z</p>"}]}, {"id": "k1s6", "title": "Титриметрия, метод нейтрализации", "items": [{"n": 166, "q": "Индикаторы", "a": "<ul class=\"src-list\"><li>слабые кислоты и основания, которые способны окрашиваться в зависимости от рН среды и каждый индикатор имеет свой интервал перехода</li></ul><p>(фенолфталеин 8,2-10; метилоранж 3,1-4,4; бромтимоловый синий 6-7,6)</p>"}, {"n": 167, "q": "Механизм изменения индикаторов", "a": "<p>Тк индикаторы слабые кислоты и основания, то, на примре метилового красного, в растворах в кислой среде он будет в недиссоциированной форме(Hln), и будет красный, а в щелочной в диссоциированной(ln<sup>−</sup>), следовательно окраска меняется на желтую.</p>"}, {"n": 168, "q": "Одноцветные индикаторы", "a": "<ul class=\"src-list\"><li>у которых ионная и молекулярная форма имеют один цвет (фенолфталеин(бесцветный/малиновый)</li></ul><p>Двухцветные индикаторы имеют один цвет в молекулярной форме и другой в ионной</p><p>(метилоранж(красный/желтый), лакмус (красный/синий)</p>"}, {"n": 169, "q": "Точка перехода окраски индикатора", "a": "<ul class=\"src-list\"><li>когда индикатор наполовину диссоциирован</li></ul><p>(оба цвета выраженные одинаково), то есть количество молекул = количеству ионов</p><p>Интервал перехода - промежуток между двумя значениями рН, в котором происходит постепенная смена окраски индикатора</p><p>Метилоранж 3,1-4,4; фенолфталеин 8,2-10; бромтимоловый синий 6-7,6</p>"}, {"n": 170, "q": "Универсальные индикаторы", "a": "<ul class=\"src-list\"><li>смесь индикаторов, которые дают плавный переход окраски по всему диапазону рН(1-14). Позволяют сразу определить среду по шкале цветов и применяются в измерении рН в лабораториях и контроле качества почвы, воды, продуктов.</li></ul>"}, {"n": 171, "q": "Титрование", "a": "<ul class=\"src-list\"><li>процесс медленного добавления небольшими порциями одного из растворов (титранта) к заранее известному объему другого(анализирующему веществу). Ведется до тех пор, пока количество добавленного титранта не станет химически эквивалентно количеству анализируемого вещества</li></ul><p>Сущность этого процесса-основан на проведении химической реакции, в которой взаимодействует вещество с точной заранее известной концентрацией и вещество с определяемой концентрацией</p><p>Цель - определить концентрации раствора, установление состава вещества и стандартизация растовора</p>"}, {"n": 172, "q": "Расчеты в тетриметрическом анализе основаны на законе…", "a": "<p>Расчеты в тетриметрическом анализе основаны на законе эквивалентов, где С₁/z(р- ра1)×V(р-ра1)=С₁/z(р-ра2)*V(р-ра2)</p>", "derived": 1}, {"n": 173, "q": "Метод ацидиметрии - метод объемного анализа, с…", "a": "<p>Метод ацидиметрии - метод объемного анализа, с помощью которого определяют основания, их соли, подвергающиеся гидролизу по аниону, с помощью титрованного раствора кислоты</p><p>Метод алкалиметрии - метод объемного анализа, с помощью которого определяют кислоты, их соли, подвергающиеся гидролизу по катиону, с помощью титрованного раствора щелочи</p>", "derived": 1}, {"n": 174, "q": "Мерный цилиндр, коническая колба, мерная колба, бюретка,…", "a": "<p>Мерный цилиндр, коническая колба, мерная колба, бюретка, пипетка</p>", "derived": 1}, {"n": 175, "q": "Титрованнные растворы", "a": "<ul class=\"src-list\"><li>это те, концентрация которых точно известна и выражена либо через молярную концентрацию эквивалента, либо через титр</li></ul><p>По точно взятой навеске можно приготовить раствор с точно известной концентрацией из веществ, называемых первичные стандарты - кристаллогидрат щавелевой кислоты, тетраборат натрия, дихромат калия.</p><p>Свойства этих веществ: устойчивость, достаточная чистота( без примесей), растворимость в растворителе</p><p>Для этих растворов определяется титр приготовленный Т=m(навески)/V(колбы), а для анализирующего вещества титр установленный Т=С₁/z*M₁/z / 1000.</p>"}, {"n": 176, "q": "Стандартизация титранта", "a": "<ul class=\"src-list\"><li>установление точной концентрации раствора в процессе титрования. Выполняется по методике: 1.бюретка заполняется раствором hcl 2.пипеткой отмерить 10 мл раствора карбоната натрия и переместить в колбу для титрования 3. Добавить 2-3мл метилоранжа в колбу 4. Титровать раствором hcl до изменения окраски индикатора с желтого на оранжевый 5. Записать объем hcl.</li></ul><p>Титр рассчитывается по формуле Т=m(в-ва)/V(затраченный на титрование)</p>"}, {"n": 177, "q": "Кривые титрования", "a": "<ul class=\"src-list\"><li>графическое изображение зависимости рН от объема добавленного титранта. Скачок титрования - резкое изменение рН раствора вблизи точки эквивалентности; скачок титр. измеряется высотой вертикального участка кривой титрования</li></ul>"}, {"n": 178, "q": "Метод нейтрализации", "a": "<ul class=\"src-list\"><li>метод объемного анализа , основанный на количественном определении кислот, оснований и гидролизующихся солей; реакция, лежащая в основе этого метода - реакция нейтрализации. Титранты - сильные кислоты (hcl, h2so4)!0, используются для определения концентрации оснований и их солей, образованных сильным основанием и слабой кислотой; сильные основания</li></ul><p>(Naoh,koh)<sup>−</sup> используются для определения концентрации кислот и солей, образованных сильной кислотой и слабым основанием. определяемые вещества в методе: для кислот : na2co3, na2b4o7*10h2o; для оснований: щавелевая кислота</p>"}, {"n": 179, "q": "Применение метода нейтрализации в медико-биологических исследованиях", "a": "<p>В клиническом анализе определяют рН крови, желудочного сока, мочи, содержание кислот и аминокислот в моче</p><p>В санитарно-гигиеническом анализе определяют рН пищевых продуктов, питьевых источников, а так же рН промышленных стоков до и после очистки</p>"}, {"n": 180, "q": "Ацидиметрия.", "a": "<p>метод объемного анализа, с помощью которого определяют основания, их соли, подвергающиеся гидролизу по аниону, с помощью титрованного раствора кислоты; титранты :кислота анализирующее вещество: щелочь</p>"}, {"n": 181, "q": "Алкалиметрия", "a": "<p>метод объемного анализа, с помощью которого определяют кислоты, их соли, подвергающиеся гидролизу по катиону, с помощью титрованного раствора щелочи; титранты: щелочь, анализирующее вещество: кислота</p>"}, {"n": 182, "q": "Правило выбора индикатора:", "a": "<p>индикатор выбирают таким образом, чтобы интервал перехода его окраски лежал внутри скачка титрования или частично его захватывал</p>"}, {"n": 183, "q": "Для титрования слабого основания (nh4oh) сильной кислотой(hcl)…", "a": "<p>Для титрования слабого основания (nh4oh) сильной кислотой(hcl) используют метиловый красный, так как в результате реакции среда будет кислая из-за образования соли(nh4cl), подвергающаяся гидролизу. В кислой области будет находится точка эквивалентности</p>", "derived": 1}, {"n": 184, "q": "Для титрования слабой кислоты сильным основанием используют…", "a": "<p>Для титрования слабой кислоты сильным основанием используют фенолфталеин, тк в результате реакции среда будет щелочная и точка эквивалентности будет в щелочной области.</p>", "derived": 1}, {"n": 185, "q": "Na₂co3 +2hcl=2nacl+h2o+co2", "a": "<p>Na₂co3 +2hcl=2nacl+h2o+co2</p><p>Нужно взять метиловый красный, так как точка эквивалентности лежит в кислой среде из- за h2co3)</p>", "derived": 1}, {"n": 186, "q": "Na₂CO₃+2HCl=2NaCl+H₂O+CO₂", "a": "<p>Na₂CO₃+2HCl=2NaCl+H₂O+CO₂</p><p>C₁/z(hcl)= C₁/z(na2co3)*V(na2co3) / V(hcl)</p><p>T= C₁/z(hcl)×M₁/z(hcl) / 1000</p>", "derived": 1}, {"n": 187, "q": "Методика определения массы тетрабората натрия в растворе методом ацидиметрии. Уравнение реакции, объясните выбор индикатора, формула для расчета", "a": "<p class=\"muted\">Ответа в материалах нет.</p>"}]}, {"id": "k1s7", "title": "Электропроводность и кондуктометрия", "items": [{"n": 259, "q": "Понятие о проводниках второго рода. Механизм проводимости. Примеры химического и биологического характера.", "a": "<p>Проводники 2 рода - электроды, обратимые относительно и катионов, и анионов, к ним относятся электролиты. В растворах и расплавах они диссоциируют на катион и анион и в электрическом поле катион движется к катоду, анион - к аноду. Это движение ионов создает электрический ток в растворе. На электродах происходит электролиз - выделение или осаждение веществ. Особенность проводников 2 рода в том, что проводимость зависит от концентрации и температуры и в отличие от металлов, где ток обусловлен движением электронов, здесь ток создается переносом ионов.</p><p>Примеры: расплав AlCl₃ (проводит ток за счет Al₃<sup>+</sup> и Cl<sup>−</sup>), раствор NaCl, где при прохождении тока происходит электролиз (Na на катоде и Cl на аноде); Передача нервного импульса(основана на движении Ионов Na<sup>+</sup> и К<sup>+</sup> через мембрану нейрона), работа сердца</p><p>(обеспечивается эл.потенциалами, возникающими при обмене ионов через мембраны клеток миокарда)</p>"}, {"n": 260, "q": "Факторы, влияющие на электропроводность растворов.", "a": "<ul class=\"src-list\"><li class=\"num\"><span class=\"n\">1.</span> Природа электролита</li><li class=\"num\"><span class=\"n\">2.</span> Природа растворителя (чем сильнее растворитель диссоциирует вещество на ионы, тем выше электропроводность)</li><li class=\"num\"><span class=\"n\">3.</span> Температура (при повышении подвижность ионов возрастает, увеличивается проводимость)</li><li class=\"num\"><span class=\"n\">4.</span> Концентрация раствора (при увеличении сначала проводимость растет, затем уменьшается, тк ионы начинают взаимодействовать друг с другом)</li><li class=\"num\"><span class=\"n\">5.</span> Тип ионов (чем меньше масса и размер ионов, тем выше их проводимость )</li><li class=\"num\"><span class=\"n\">6.</span> Заряд ионов ( чем выше заряд и скорость перемещения иона , тем больше кол-во электричества, которое он перенесет, след. проводимость больше)</li><li class=\"num\"><span class=\"n\">7.</span> Градиент потенциала</li><li class=\"num\"><span class=\"n\">8.</span> Степень гидратации</li></ul>"}, {"n": 261, "q": "Удельная электропроводимость. Физический смысл, математическое выражение, единицы измерения.", "a": "<p>Удельная электропроводимость - проводимость электролита, помещенного между 2мм параллельных платиновых электрода, площадью 1см3=1л и расстоянием 1 см. (обратная величина удельного сопротивления (1/р))</p><p>Каппа = l / R*S , R - Электричсекое сопротивление проводника, l - длина проводника, S<sup>−</sup> площадь поперечного сечения проводника, каппа - удельная электропроводимость</p><p>Ом-1*см-1.</p>"}, {"n": 262, "q": "Молярная электрическая проводимость. Физический смысл, единицы измерения", "a": "<p>Молярная электропроводность- электропроводность раствора электролита , содержащего</p><p>1 моль эквивалента электролита, помещенными между 2 мм параллельными платиновыми электродами, расположенными на расстоянии 1 см</p><p>Единицы измерения Ом-1*см2*моль*экв-й</p>"}, {"n": 263, "q": "Взаимосвязь удельной и молярной электрической проводимости (уравнение взаимосвязи).", "a": "<p>Взаимосвязь показывает, как общая проводимость раствора связана с количеством растворенного электролита</p><p>Лямбда = каппа/С или каппа = лямбда * С, где С - концентрация электролита</p><p>Удельная эл. зависит от общего числа Ионов в единице объема раствора, а молярная показывает вклад одного моля эквивалента электролита в проводимость.</p>"}, {"n": 264, "q": "Перечислите факторы, влияющие на скорость движения ионов в электрическом", "a": "<p>поле. 1. Напряженность электрического поля (чем поле сильнее, тем больше сила, действующая на ион- ион движется быстрее) 2. Заряд иона (обычно чем больше заряд,тем сильнее поле действ на ион, но некоторые ионы с большим зарядом сильно гидратируются и движутся медленнее) 3. Размер иона и степень гидратации (маленькие ионы с сильной гидратацией двигаются медленнее. Гидратная оболочка увелич «эффективный размер» иона и снижает скорость) 4. Температура (чем выше температура, тем больше скорость движения из-за уменьшения вязкости жидкости) 5. Концентрация растворов электролитов</p><p>(ионы взаимодействуют друг с другом и образуют ионные пары) 6. Природа растворителя</p><p>(зависит от диэлектрической проницаемости и способности р-ля образов.гидратные оболочки; Чем более полярный растворитель, тем легче ионы перемещаются)</p>"}, {"n": 265, "q": "Сущность электрофоретического эффекта торможения при движении ионов в электрическом поле.", "a": "<p>Явление, при котором движение ионов в поле замедляется из-за встречного потока растворителя, т.е торможение центрального иона идет за счет «оболочки» из ионов противоположного знака.</p>"}, {"n": 266, "q": "Сущность релаксационного эффекта торможения при движении ионов в электрическом поле.", "a": "<p>Это эффект, возникающий при замедлении движения ионов в поле из-за искажения и запаздывания перестройки ионной атмосферы вокруг них, «облако» противоположно заряженных ионов не успевает смещаться вслед за ним, создавая встречное электрическое поле</p>"}, {"n": 267, "q": "Объясните зависимость скорости движения ионов в электрическом поле от величин зарядов ионов.", "a": "<p>Чем больше заряд иона, тем выше их скорость, так как сила, действующая на ион в поле, тоже становится выше. Но если смотреть практически, то сильнозаряженные ионы быстро гидратируются и их размер увеличивается, соответственно скорость движения становится меньше.</p>"}, {"n": 268, "q": "Объясните на примере катионов щелочных металлов влияние радиуса иона на скорость его движения в электрическом поле.", "a": "<p>Чем меньше радиус иона, тем сильнее он притягивает молекулы воды (или других растворителя), образуя гидратную оболочку(Li +самый маленький ион, сильно поляризует молекулы воды и образует большую и плотную гидратную оболочку; Cs<sup>+</sup> самый большой ион, слабее притягивает воду и гидратная оболочка соотв. маленькая). Если гидратная оболочка большая, то скорость движения иона замедляется. <em>Вывод</em>: чем меньше радиус, тем ниже будет скорость движения из-за высокой степени гидратации</p>"}, {"n": 269, "q": "Какие ионы обладают аномально большой скоростью движения в электрическом поле? Объясните причину явления.", "a": "<p>Аномально высокая подвижность наблюдается у ионов Н<sup>+</sup> и ОН<sup>−</sup> и объясняется это явление</p><p>«эстафетным» механизмом переноса : протоны в растворах не закреплены за определенными молекулами воды , с которыми они образуют ион H₃O<sup>+</sup>, а постоянно перескакивают с одной молекулы, на другую. Электрический ток переносится скачкообразным переходом протонов водорода от ионов гидроксония к соседним молекулам воды.</p>"}, {"n": 270, "q": "Объясните графическую зависимость удельной электрической проводимости слабых и сильных электролитов от разбавления.", "a": "<p>С увеличением, каппа возрастает, достигая некоторого максимального значения, затем начинает уменьшаться. Эта зависимость хороша выражена для сильных и значительно хуже для слабых электролитов. Наличие максимума на кривой объясняется тем, что в разбавленных растворах сильных электролитов движение ионов мало зависит от концентрации и сначала растет почти прямо пропорционально числу ионов</p><p>Для слабых электролитов наличие максимума на кривой обусловлено тем, что с ростом концентрации, уменьшается степень диссоциации и при достижении определенной концентрации, число ионов в растворе начинает увеличиваться медленнее, чем при предыдущей концентрации</p>"}, {"n": 271, "q": "Объясните графическую зависимость молярной электрической проводимости слабых и сильных электролитов от разбавления.", "a": "<p>Молярная электропроводность как сильных, так и слабых увеличивается с уменьшением концентрации, достигая некоторого предельного значения, называемого молярная электропроводность при бесконечном разведении.</p><p>Для слабых электролитов такая зависимость обуславливается в основном увеличением степени диссоциации с разбавлением</p><p>В случае сильного электролита с уменьшением концентрации увеличивается скорость движения ионов и молярная электропроводность</p>"}, {"n": 272, "q": "Понятие о предельной электрической проводимости электролитов. Закон Кольрауша, его математическое выражение.", "a": "<p>Закон: при бесконечном разведении, катионы и анионы взаимодействуют независимо друг от друга, тк в этих условиях даже слабый электролит почти полностью диссоциирует и ионы друг другу не мешают</p><p>Лямбда беск. = лямбда К + лямбда А; лямбда К/А = Vк/а × F (F=96500)</p><p>Лямбда бесконечность - предельная молярная электропроводность, которая равна сумме молярной подвижности катионов и анионов .</p>"}, {"n": 273, "q": "Объясните влияние напряжённости электрического поля на электропроводность растворов слабых и сильных электролитов.", "a": "<p>У сильных электролитов электропроводность почти не зависит от напряженности поля, тк они диссоциируют полностью; при очень больших полях возможны небольшие отклонения из-за электрофоретического и релаксационного эффекта.</p><p>У слабых электролитов электропроводность увеличивается с ростом напряженности, потому что поле способствует усилению диссоциации молекулы на ионы.</p>"}, {"n": 274, "q": "Понятие об абсолютной скорости движения ионов. Молярная подвижность ионов электролита (формула для расчета).", "a": "<p>Абсолютная скорость движения иона (V) - скорость, с которой он перемещается в растворе под действием электрического поля. Определяется как расстояние, которое проходит ион за одну секунду при градиенте потенциала 1 В/см; V= u×E, где u - подвижность иона, E - напряженность электрического поля.</p><p>Молярная подвижность (U) показывает, какая скорость движения иона соответствует единичной напряженности поля при прохождении 1 моль зарядов; U=F*V где V - скорость иона, F - постоянная Фарадея = 96500.</p>"}, {"n": 275, "q": "Объясните влияние температуры на электропроводность растворов электролитов.", "a": "<p>При увеличении температуры скорость движения ионов увеличивается, температура уменьшает вязкость среды, соотвественно электропроводность становится выше.</p>"}, {"n": 276, "q": "Сравнительная характеристика электропроводности тканей и жи
